<section class="flex justify-between gap-2 items-start">
  <div class="flex-1 flex flex-col gap-1.5 min-w-0">
    <h1 class="text-[clamp(1.875rem,6vw,3rem)] font-bold tracking-[-0.04em] leading-none text-[var(--foreground)]">
      {{ 'landing.hero.greeting' | translate | async }}
    </h1>
    <p class="text-xl font-normal leading-snug text-[var(--foreground)] mt-1 max-w-[600px]">
      {{ 'landing.hero.tagline' | translate | async }}
    </p>
  </div>

  <div class="w-32 h-32 rounded-full overflow-hidden flex-shrink-0 border border-[var(--border)]">
    <img src="/james-abib.jpg" alt="James ABIB" width="128" height="128" class="w-full h-full object-cover block" />
  </div>
</section>
