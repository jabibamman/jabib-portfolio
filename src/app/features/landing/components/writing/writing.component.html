<section class="pb-4 flex flex-col gap-8">
  <div class="flex flex-col items-center justify-center gap-2 text-center">
    <div class="inline-block rounded-lg px-3 py-1 text-sm bg-[var(--foreground)] text-[var(--background)]">
      {{ 'landing.writing.badge' | translate | async }}
    </div>
    <h2 class="text-[clamp(1.875rem,5vw,3rem)] font-bold tracking-[-0.04em] text-[var(--foreground)]">
      {{ 'landing.writing.title' | translate | async }}
    </h2>
    <p class="text-lg leading-relaxed max-w-[600px] text-[var(--muted-fg)]">
      {{ 'landing.writing.subtitle' | translate | async }}
    </p>
  </div>

  <ul class="m-0 ml-4 mb-4 p-0 list-none border-l border-[var(--border)]">
    <li
      *ngFor="let article of articles$ | async; last as isLast"
      class="relative ml-10 py-4"
      [class.border-b]="!isLast"
      [class.border-dashed]="!isLast"
      [class.border-[var(--border)]]="!isLast"
    >
      <div class="flex flex-col gap-1">
        <time class="text-xs text-[var(--muted-fg)]">
          {{ 'landing.writing.draftLabel' | translate | async }}
        </time>
        <h3 class="font-semibold leading-snug m-0 text-base text-[var(--foreground)]">
          {{ article.title }}
        </h3>
        <span class="text-sm leading-relaxed text-[var(--muted-fg)]">
          {{ article.excerpt }}
        </span>
      </div>
    </li>
  </ul>
</section>
