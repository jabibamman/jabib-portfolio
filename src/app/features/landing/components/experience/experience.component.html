<section>
  <div class="flex flex-col gap-3">
    <h2 class="text-xl font-bold text-[var(--foreground)]">
      {{ 'landing.experience.title' | translate | async }}
    </h2>

    <div *ngFor="let job of jobs$ | async" class="flex py-1" (mouseenter)="onEnter(job.id)" (mouseleave)="onLeave()">
      <div class="flex-none">
        <div
          class="w-12 h-12 rounded-full overflow-hidden border border-[var(--border)] bg-[var(--secondary)] flex items-center justify-center"
        >
          <img [src]="logoSrc(job.logo)" [alt]="job.org" class="w-full h-full object-cover block" />
        </div>
      </div>

      <div class="flex-1 ml-4 min-w-0">
        <button
          type="button"
          (click)="toggle(job.id)"
          class="block w-full bg-transparent border-none p-0 cursor-pointer font-inherit text-inherit text-left"
        >
          <div class="flex flex-col w-full">
            <div class="flex items-center justify-between gap-2">
              <h3
                class="inline-flex items-center font-semibold leading-none text-sm gap-1 text-left text-[var(--foreground)]"
              >
                {{ job.org }}
                <lucide-icon
                  name="chevron-right"
                  [size]="16"
                  class="flex-shrink-0 transition-all duration-300 ease-out"
                  [style.opacity]="isHovered(job.id) || isOpen(job.id) ? 1 : 0"
                  [style.transform]="
                    isOpen(job.id)
                      ? 'rotate(90deg) ' + (isHovered(job.id) ? 'translateY(-0.25rem)' : '')
                      : isHovered(job.id)
                        ? 'translateX(0.25rem)'
                        : 'translateX(0)'
                  "
                ></lucide-icon>
              </h3>
              <div
                class="text-sm [font-variant-numeric:tabular-nums] text-[var(--muted-fg)] text-right whitespace-nowrap"
              >
                {{ job.dates }}
              </div>
            </div>
            <div class="text-xs mt-1 text-left text-[var(--foreground)]">{{ job.role }}</div>
          </div>
        </button>

        <div *ngIf="isOpen(job.id)" class="mt-2 text-sm px-0 pb-4">
          <div class="leading-relaxed whitespace-pre-line text-[var(--foreground)]">
            {{ job.details }}
          </div>
          <div class="mt-4 pt-3 border-t border-dashed border-[var(--border)]">
            <span class="text-xs font-semibold text-[var(--muted-fg)] block mb-1.5">
              {{ 'landing.experience.skillsLabel' | translate | async }}
            </span>
            <div class="flex flex-wrap gap-1.5">
              <div
                *ngFor="let skill of job.skills"
                class="inline-flex items-center rounded-md px-2.5 py-0.5 font-semibold text-xs bg-[var(--foreground)] text-[var(--background)]"
              >
                {{ skill }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
